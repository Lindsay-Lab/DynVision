name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopencv-dev pkg-config libturbojpeg0-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid ~2.5GB CUDA download
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          # flake8<7.1 ships pycodestyle<=2.11.1, which crashes with IndexError on
          # Python 3.12. Force-upgrade both to the fixed versions.
          pip install --upgrade "flake8>=7.1.0" "pycodestyle>=2.12.0"

      - name: Verify linter versions
        run: |
          flake8 --version
          python -c "import pycodestyle, sys; v=tuple(map(int, pycodestyle.__version__.split('.')[:2])); sys.exit('pycodestyle %s < 2.12 — Python 3.12 crash bug' % pycodestyle.__version__) if v < (2, 12) else print('pycodestyle', pycodestyle.__version__, 'OK')"

      - name: Lint with flake8
        run: flake8 dynvision

      - name: Check formatting with black
        run: black --check --config pyproject.toml dynvision

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopencv-dev pkg-config libturbojpeg0-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid ~2.5GB CUDA download
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=dynvision \
            --cov-report=xml \
            --cov-report=term-missing \
            -n auto

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
